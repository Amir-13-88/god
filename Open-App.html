<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=dist/index.html">
    <title>در حال بارگذاری برنامه...</title>
    <style>
        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
            background: rgba(255,255,255,0.1);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        h1 {
            margin: 0 0 20px 0;
            font-size: 28px;
        }
        p {
            margin: 0 0 30px 0;
            font-size: 16px;
            opacity: 0.9;
        }
        .loader {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        a {
            color: #ffd700;
            text-decoration: none;
            font-weight: bold;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="loader"></div>
        <h1>🎓 لایتنر زبان</h1>
        <p>در حال بارگذاری برنامه...</p>
        <p>اگه خودکار باز نشد، <a href="dist/index.html">اینجا کلیک کن</a></p>
    </div>
    
    <script>
        // انتقال خودکار به dist/index.html
        setTimeout(function() {
            window.location.href = 'dist/index.html';
        }, 500);
    </script>
</body>
</html>
